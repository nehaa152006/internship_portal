{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-3"><i class="fa-solid fa-right-to-bracket"></i> Login</h4>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">New student? <a href="{{ url_for('register') }}">Register here</a></p>
                <div class="mt-3 pt-3 border-top text-muted small">
                    <p class="mb-1 fw-bold text-dark"><i class="fa-solid fa-key me-1 text-primary"></i>Demo Credentials:</p>
                    <div>Student: <code>student@demo.com</code> / <code>student123</code></div>
                    <div>Admin: <code>admin@university.edu</code> / <code>admin123</code></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
