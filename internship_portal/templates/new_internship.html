{% extends 'base.html' %}
{% block title %}Add Internship{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-3"><i class="fa-solid fa-briefcase"></i> Add Internship Record</h4>
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" name="company_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role / Position</label>
                        <input type="text" name="role" class="form-control">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" name="start_date" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" name="end_date" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Type</label>
                            <select name="internship_type" class="form-select">
                                <option value="Paid">Paid</option>
                                <option value="Unpaid">Unpaid</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Mode</label>
                            <select name="mode" class="form-select">
                                <option value="Online">Online</option>
                                <option value="Offline">Offline</option>
                                <option value="Hybrid">Hybrid</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Domain</label>
                            <input type="text" name="domain" class="form-control" placeholder="e.g. Web Dev">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Internship Letter Status</label>
                        <select name="letter_status" class="form-select">
                            <option value="Pending">Pending</option>
                            <option value="Submitted">Submitted</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Upload Internship Letter (PDF/Image)</label>
                        <input type="file" name="letter_file" class="form-control">
                        <div class="form-text">Required if status is "Submitted".</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Record</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
